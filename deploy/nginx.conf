# 作业小站 · nginx 反向代理示例
#
# 放到 /etc/nginx/sites-available/homework-board，然后：
#   ln -s /etc/nginx/sites-available/homework-board /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# 想上 HTTPS 的话，先按上面配好 80 端口能访问，再执行：
#   apt install -y certbot python3-certbot-nginx
#   certbot --nginx -d 你的域名
# certbot 会自动把下面这段改成 443 + 证书，并加好跳转。

server {
    listen 80;
    listen [::]:80;

    # 把 your.domain.com 换成你自己的域名；没有域名就用服务器公网 IP
    server_name your.domain.com;

    # 上传体积限制（粘贴作业文本很小，给 2M 足够）
    client_max_body_size 2m;

    # 顺手加几个安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 服务本身是即时响应的，超时给短一点就行
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # 静态文件由 Node 直接发，这里不额外缓存，避免改了代码看不到
        proxy_buffering on;
    }
}
